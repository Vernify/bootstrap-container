---
# Phase 4 Orchestration Playbook — CI Core (docker01)
#
# Provisioning (Terraform apply against terraform-build01-deploy, which
# outputs docker01_* values) happens in scripts/bootstrap-phase-3-5.sh; this
# playbook starts from an already-reachable docker01 host, deploys Jenkins,
# and wires it to Vault using the Jenkins AppRole created in Phase 3.
#
# Real role FQCNs and variable names (verified against
# meta/argument_specs.yml / defaults/main.yml on feat/phase-3-5-bootstrap):
#   blueprints.jenkins.container_server        -> jenkins_server_*
#   blueprints.jenkins_integrations.vault_auth -> jenkins_integration_vault_*
#                                                  (RESOLVED: argument_specs.yml
#                                                  for this role previously
#                                                  documented
#                                                  jenkins_integration_vault_client_id/
#                                                  _client_secret, which the
#                                                  real tasks/main.yml never
#                                                  read. That spec/code mismatch
#                                                  was fixed (commit aa33fd1 and
#                                                  related) — argument_specs.yml
#                                                  now correctly documents
#                                                  jenkins_integration_vault_endpoint/
#                                                  _role_id/_secret_id plus
#                                                  jenkins_integration_jenkins_url/
#                                                  _admin_user/_admin_password,
#                                                  matching this playbook's
#                                                  variable names.)
#
# RESOLVED (previously tracked as a KNOWN GAP): blueprints.jenkins.container_server's
# defaults/main.yml exposes jenkins_server_vault_url/_role_id/_secret_id "for
# jenkins_integrations.vault_auth role to fill", but vault_auth's tasks/main.yml
# only sets those same three facts as outputs — it does not write them back
# into a running Jenkins container's config. The actual credential write
# happens via Jenkins' REST API (vault_auth's "Create Jenkins Credentials"
# task), so no extra wiring is needed here. This is expected behaviour, not a
# gap; kept here for traceability.

- name: "Phase 4 — CI Core (docker01) Orchestration"
  hosts: localhost
  gather_facts: true
  vars:
    # ----- Inputs from the calling script -----
    sec01_ip: "{{ sec01_ip | mandatory }}"
    docker01_ip: "{{ docker01_ip | mandatory }}"
    ansible_ssh_private_key_file_arg: "{{ ansible_ssh_private_key_file | default('/root/.ssh/id_vernify_bootstrap') }}"
    bootstrap_ssh_user: "{{ ansible_user | default('ubuntu') }}"

    vernify_internal_domain: "vernify.internal"
    agent01_ip: "192.168.22.53"

    vault_endpoint: "https://sec01.{{ vernify_internal_domain }}:8200"
    step_ca_endpoint: "https://sec01.{{ vernify_internal_domain }}:443"
    vault_cacert_path: "/etc/ssl/certs/step-ca-root.crt"
    jenkins_endpoint: "https://docker01.{{ vernify_internal_domain }}:8443"
    kv_mount: "kv"

    # Jenkins admin credentials used by vault_auth to call the Jenkins API.
    # Generated fresh on first run if not supplied; stored in Vault for reuse.
    jenkins_admin_user: "admin"

  pre_tasks:
    - name: "[PRE] Validate required inputs"
      ansible.builtin.assert:
        that:
          - sec01_ip is defined and sec01_ip | length > 0
          - docker01_ip is defined and docker01_ip | length > 0
        fail_msg: "Missing sec01_ip / docker01_ip. Expected as extra-vars from scripts/bootstrap-phase-3-5.sh."

    - name: "[PRE] Verify Phase 3 completed (Vault reachable and unsealed)"
      ansible.builtin.uri:
        url: "{{ vault_endpoint }}/v1/sys/health"
        method: GET
        validate_certs: false
      register: vault_health_check
      failed_when: vault_health_check.json.sealed | default(true)
      retries: 5
      delay: 5

    - name: "[PRE] Add docker01 to in-memory inventory"
      ansible.builtin.add_host:
        name: docker01
        ansible_host: "{{ docker01_ip }}"
        ansible_user: "{{ bootstrap_ssh_user }}"
        ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file_arg }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    - name: "[PRE] Configure /etc/hosts on docker01"
      ansible.builtin.copy:
        content: |
          127.0.0.1 localhost
          ::1 ip6-localhost ip6-loopback

          {{ sec01_ip }} sec01 sec01.{{ vernify_internal_domain }} vault vault.sec01 vault.sec01.{{ vernify_internal_domain }} step-ca ca.sec01 ca.sec01.{{ vernify_internal_domain }}
          {{ docker01_ip }} docker01 docker01.{{ vernify_internal_domain }} jenkins jenkins.docker01 jenkins.docker01.{{ vernify_internal_domain }}
          {{ agent01_ip }} agent01 agent01.{{ vernify_internal_domain }}
        dest: /etc/hosts
        mode: "0644"
        owner: root
        group: root
      become: true
      delegate_to: docker01

    # blueprints.step_ca.issue_certificate runs on localhost (see that
    # include_role's apply: block below) and requests against sec01 (where
    # step-ca actually runs, not docker01) -- localhost needs to resolve
    # sec01's internal DNS name. Additive (lineinfile), not a full
    # overwrite, since this is the container's own /etc/hosts.
    - name: "[PRE] Add sec01 DNS entry to localhost's /etc/hosts (issue_certificate runs here)"
      # /etc/hosts inside a Docker container is bind-mounted -- lineinfile/copy
      # use an atomic write-temp-then-rename pattern internally, which fails
      # with "Device or resource busy" against a bind-mount target. Append
      # directly instead, guarded by an idempotency check.
      ansible.builtin.shell: |
        set -o pipefail
        if ! grep -qF "{{ sec01_ip }} sec01" /etc/hosts; then
          echo "{{ sec01_ip }} sec01 sec01.{{ vernify_internal_domain }} vault vault.sec01 vault.sec01.{{ vernify_internal_domain }} step-ca ca.sec01 ca.sec01.{{ vernify_internal_domain }}" >> /etc/hosts
        fi
      args:
        executable: /bin/bash
      changed_when: true

    # blueprints.jenkins.container_server runs community.docker.docker_container
    # against docker01 -- the Docker engine itself is not part of the Packer
    # template and must be installed here before that role runs.
    - name: "[PRE] Check if Docker is already installed on docker01 (idempotency)"
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker01_docker_check
      become: true
      delegate_to: docker01

    - name: "[PRE] Install Docker Engine on docker01"
      become: true
      delegate_to: docker01
      when: not docker01_docker_check.stat.exists
      block:
        - name: "Install prerequisites"
          ansible.builtin.apt:
            name: ["ca-certificates", "curl", "python3-pip"]
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: "Create keyrings directory"
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: "Download Docker's official GPG key"
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: "Determine Debian architecture name (dpkg, not ansible_architecture -- avoids translation bugs)"
          ansible.builtin.command: dpkg --print-architecture
          register: dpkg_arch
          changed_when: false

        - name: "Add Docker apt repository"
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ dpkg_arch.stdout }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
            state: present
            filename: docker

        - name: "Install Docker Engine"
          ansible.builtin.apt:
            name: ["docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]
            state: present
            update_cache: true

        - name: "Ensure Docker service is enabled and running"
          ansible.builtin.systemd:
            name: docker
            state: started
            enabled: true

        - name: "Install Docker Python SDK (required by community.docker.docker_container)"
          ansible.builtin.pip:
            name: docker
            state: present
            break_system_packages: true

  tasks:
    # ============================================================
    # STEP 1: Retrieve secrets needed for this phase from Vault
    # (Phase 3 already wrote these; Phase 4 only reads — no hardcoded values)
    #
    # The bootstrap operator still holds VAULT_TOKEN (root or a break-glass
    # token) at this point in the bootstrap sequence — AppRole auth is what
    # Jenkins/agents use at runtime, not what this orchestration playbook
    # uses to read Phase 3's seeded secrets. Read via `vault kv get` over
    # SSH on sec01 rather than a Vault lookup plugin so this works with
    # whatever VAULT_TOKEN the operator's shell currently has exported,
    # consistent with Phase 3's own Vault CLI usage.
    # ============================================================
    - name: "[STEP 1] Retrieve step-ca provisioner password from Vault"
      block:
        - name: "Read step-ca provisioner password from Vault KV"
          environment:
            VAULT_ADDR: "{{ vault_endpoint }}"
            VAULT_CACERT: "{{ vault_cacert_path }}"
            VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
            VAULT_SKIP_VERIFY: "true"
          ansible.builtin.command: >
            vault kv get -field=value {{ kv_mount }}/platform/step-ca/provisioner-password
          register: step_ca_password_lookup
          delegate_to: sec01
          no_log: true
          changed_when: false

        - name: "Set step_ca_provisioner_password fact"
          ansible.builtin.set_fact:
            step_ca_provisioner_password: "{{ step_ca_password_lookup.stdout }}"
          no_log: true

    # ============================================================
    # STEP 2: Issue TLS certificate for Jenkins
    # ============================================================
    - name: "[STEP 2] Issue TLS certificate for Jenkins from step-ca"
      ansible.builtin.include_role:
        name: blueprints.step_ca.issue_certificate
        apply:
          # localhost, not docker01: the step CLI is baked into the
          # bootstrap-container image, not installed on docker01. Cert
          # issuance is a client-side operation against step-ca's
          # network-reachable HTTPS API on sec01; the role returns
          # cert/key as facts (content, not file paths), so where the
          # command runs doesn't matter downstream.
          delegate_to: localhost
      vars:
        step_ca_issue_ca_url: "{{ step_ca_endpoint }}"
        step_ca_issue_ca_fingerprint: "{{ lookup('env', 'STEP_CA_ROOT_FINGERPRINT', default='') }}"
        step_ca_issue_provisioner_password: "{{ step_ca_provisioner_password }}"
        step_ca_issue_certificate_common_name: "jenkins.docker01.{{ vernify_internal_domain }}"
        step_ca_issue_certificate_subject_alt_names:
          - "jenkins"
          - "jenkins.docker01"
          - "jenkins.docker01.{{ vernify_internal_domain }}"
          - "{{ docker01_ip }}"
        step_ca_issue_certificate_validity_days: 365
      register: jenkins_cert_issue_result

    - name: "Set facts for Jenkins TLS material"
      ansible.builtin.set_fact:
        jenkins_tls_cert_pem: "{{ step_ca_issue_certificate_pem }}"
        jenkins_tls_key_pem: "{{ step_ca_issue_certificate_key_pem }}"
      no_log: true

    # ============================================================
    # STEP 3: Retrieve Jenkins AppRole credentials from Vault (written
    # during Phase 3 secret seeding) — never hardcoded.
    # ============================================================
    - name: "[STEP 3] Retrieve Jenkins AppRole credentials from Vault"
      environment:
        VAULT_ADDR: "{{ vault_endpoint }}"
        VAULT_CACERT: "{{ vault_cacert_path }}"
        VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
        VAULT_SKIP_VERIFY: "true"
      ansible.builtin.command: >
        vault kv get -format=json {{ kv_mount }}/platform/jenkins/approle
      register: jenkins_approle_lookup
      delegate_to: sec01
      no_log: true
      changed_when: false

    - name: "Parse Jenkins AppRole credentials"
      ansible.builtin.set_fact:
        jenkins_vault_role_id: "{{ (jenkins_approle_lookup.stdout | from_json).data.data.role_id }}"
        jenkins_vault_secret_id: "{{ (jenkins_approle_lookup.stdout | from_json).data.data.secret_id }}"
      no_log: true

    # ============================================================
    # STEP 4: Deploy Jenkins container
    # ============================================================
    - name: "[STEP 4] Deploy Jenkins container on docker01"
      block:
        - name: "Generate Jenkins admin secret (random, stored in Vault below)"
          ansible.builtin.set_fact:
            jenkins_admin_secret_generated: "{{ lookup('community.general.random_string', length=32, special=false) }}"
          no_log: true

        - name: "Run blueprints.jenkins.container_server"
          ansible.builtin.include_role:
            name: blueprints.jenkins.container_server
            apply:
              delegate_to: docker01
              become: true
          vars:
            jenkins_server_image: "jenkins/jenkins:lts-jdk21"
            jenkins_server_https_port: 8443
            jenkins_server_tls_cert: "{{ jenkins_tls_cert_pem }}"
            jenkins_server_tls_key: "{{ jenkins_tls_key_pem }}"
            jenkins_server_admin_secret: "{{ jenkins_admin_secret_generated }}"
            jenkins_server_vault_url: "{{ vault_endpoint }}"
            jenkins_server_vault_role_id: "{{ jenkins_vault_role_id }}"
            jenkins_server_vault_secret_id: "{{ jenkins_vault_secret_id }}"
          no_log: true

        - name: "Wait for Jenkins to be ready"
          ansible.builtin.uri:
            url: "{{ jenkins_endpoint }}/api/json"
            method: GET
            validate_certs: false
            status_code: [200, 403]
          delegate_to: docker01
          register: jenkins_ready_check
          retries: 30
          delay: 5
          until: jenkins_ready_check.status in [200, 403]

      rescue:
        - name: "Jenkins deployment failed"
          ansible.builtin.fail:
            msg: "blueprints.jenkins.container_server failed on docker01. Check role output above."

    # ============================================================
    # STEP 5: Wire Jenkins to Vault via AppRole (jenkins_integrations.vault_auth)
    # ============================================================
    - name: "[STEP 5] Configure Jenkins Vault plugin (AppRole auth)"
      ansible.builtin.include_role:
        name: blueprints.jenkins_integrations.vault_auth
        apply:
          delegate_to: docker01
          become: true
      vars:
        jenkins_integration_vault_endpoint: "{{ vault_endpoint }}"
        jenkins_integration_vault_role_id: "{{ jenkins_vault_role_id }}"
        jenkins_integration_vault_secret_id: "{{ jenkins_vault_secret_id }}"
        jenkins_integration_jenkins_url: "{{ jenkins_endpoint }}"
        jenkins_integration_jenkins_admin_user: "{{ jenkins_admin_user }}"
        jenkins_integration_jenkins_admin_password: "{{ jenkins_admin_secret_generated }}"
      no_log: true

    # ============================================================
    # STEP 6: Persist Jenkins admin token in Vault (kv/platform/jenkins/admin-token)
    # ============================================================
    - name: "[STEP 6] Seed kv/platform/jenkins/admin-token"
      environment:
        VAULT_ADDR: "{{ vault_endpoint }}"
        VAULT_CACERT: "{{ vault_cacert_path }}"
        VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
        VAULT_SKIP_VERIFY: "true"
      ansible.builtin.command: >
        vault kv put {{ kv_mount }}/platform/jenkins/admin-token
        value={{ jenkins_admin_secret_generated | quote }}
        owner=jenkins-ci usage=machine managed_by=automation rotation_period=30d
      delegate_to: sec01
      no_log: true
      changed_when: true

    # ============================================================
    # STEP 7: Verification
    # ============================================================
    - name: "[STEP 7] Verify Jenkins deployment"
      ansible.builtin.uri:
        url: "{{ jenkins_endpoint }}/api/json"
        method: GET
        user: "{{ jenkins_admin_user }}"
        password: "{{ jenkins_admin_secret_generated }}"
        validate_certs: false
        force_basic_auth: true
      register: jenkins_verify
      no_log: true

    - name: "Phase 4 complete"
      ansible.builtin.debug:
        msg: |
          ========== PHASE 4 COMPLETE ==========
          CI Core (docker01) is online:
            - Jenkins container deployed (TLS issued by step-ca)
            - Vault AppRole wired via jenkins_integrations.vault_auth
            - Jenkins admin token stored at kv/platform/jenkins/admin-token

          Next: Phase 5 (agent01)
          =====================================
