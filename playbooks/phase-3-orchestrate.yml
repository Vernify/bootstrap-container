---
# Phase 3 Orchestration Playbook — Security Core (sec01)
#
# Provisioning (Terraform apply for sec01) happens in the calling shell script
# (scripts/bootstrap-phase-3-5.sh); this playbook starts from an already-
# reachable sec01 host and converges step-ca + Vault, then performs secret
# seeding. Per LADR-003, secret seeding and cross-service orchestration
# (AppRole creation, KV writes) live HERE, not inside the blueprints.*
# collection roles.
#
# Real role FQCNs and variable names (verified against
# meta/argument_specs.yml and defaults/main.yml on feat/phase-b-collections,
# NOT the stale draft names from the original design doc):
#   blueprints.step_ca.container_server   -> step_ca_server_*
#   blueprints.step_ca.issue_certificate  -> step_ca_issue_*
#   blueprints.vault.container_server     -> vault_server_* (tls_cert/tls_key
#                                             take PEM CONTENT, not file paths)
#   blueprints.vault.init_and_unseal      -> vault_api_endpoint, vault_cacert_path
#                                             (outputs are plain facts:
#                                             vault_root_token, vault_unseal_keys,
#                                             vault_threshold, vault_is_initialized
#                                             — NOT vault_init_output.json.*)
#
# KNOWN GAP (documented, not silently worked around — see
# docs/delivery/COLLECTION_ROLE_INVENTORY.md and Phase D report):
#   blueprints.vault.init_and_unseal's argument_specs.yml documents a
#   `vault_is_unsealed` return value, but no task in the role ever sets that
#   fact. This playbook does NOT rely on it; it determines unseal state
#   itself via the /v1/sys/health endpoint (Steps 5-6 below).

- name: "Phase 3 — Security Core (sec01) Orchestration"
  hosts: localhost
  gather_facts: true
  vars:
    # ----- Inputs from the calling script (scripts/bootstrap-phase-3-5.sh) -----
    sec01_ip: "{{ sec01_ip | mandatory }}"
    ansible_ssh_private_key_file_arg: "{{ ansible_ssh_private_key_file | default('/root/.ssh/id_vernify_bootstrap') }}"
    bootstrap_ssh_user: "{{ ansible_user | default('ubuntu') }}"

    # ----- Secrets (from bootstrap-container .env, passed as extra-vars) -----
    proxmox_token: "{{ proxmox_token | default(lookup('env', 'PROXMOX_PASSWORD')) }}"
    terraform_cloud_token: "{{ terraform_cloud_token | default(lookup('env', 'TFC_TOKEN')) }}"
    step_ca_provisioner_password: "{{ step_ca_provisioner_password | default(lookup('env', 'STEP_CA_PROVISIONER_PASSWORD')) }}"

    # ----- Network / naming -----
    vernify_internal_domain: "vernify.internal"
    build01_ip: "192.168.22.52"
    agent01_ip: "192.168.22.53"

    # ----- Vault / step-ca endpoints -----
    vault_endpoint: "https://sec01.{{ vernify_internal_domain }}:8200"
    step_ca_endpoint: "https://sec01.{{ vernify_internal_domain }}:443"
    vault_cacert_path: "/etc/ssl/certs/step-ca-root.crt"

    # ----- Canonical Vault secret paths (VAULT_SECRET_PATH_MODEL.md) -----
    # Format: kv/<domain>/<system>/<secret_name>; domains: platform | saas | applications
    kv_mount: "kv"

  pre_tasks:
    - name: "[PRE] Validate required variables/secrets are present"
      ansible.builtin.assert:
        that:
          - sec01_ip is defined and sec01_ip | length > 0
          - proxmox_token is defined and proxmox_token | length > 0
          - terraform_cloud_token is defined and terraform_cloud_token | length > 0
          - step_ca_provisioner_password is defined and step_ca_provisioner_password | length > 0
        fail_msg: |
          Missing required inputs for Phase 3. Expected to be passed as
          extra-vars by scripts/bootstrap-phase-3-5.sh:
            sec01_ip, proxmox_token, terraform_cloud_token, step_ca_provisioner_password
        success_msg: "All required Phase 3 inputs present."

    - name: "[PRE] Add sec01 to in-memory inventory"
      ansible.builtin.add_host:
        name: sec01
        ansible_host: "{{ sec01_ip }}"
        ansible_user: "{{ bootstrap_ssh_user }}"
        ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file_arg }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    - name: "[PRE] Configure /etc/hosts on sec01 (P0-4 DNS strategy)"
      ansible.builtin.copy:
        content: |
          127.0.0.1 localhost
          ::1 ip6-localhost ip6-loopback

          {{ sec01_ip }} sec01 sec01.{{ vernify_internal_domain }} vault vault.sec01 vault.sec01.{{ vernify_internal_domain }} step-ca ca.sec01 ca.sec01.{{ vernify_internal_domain }}
          {{ build01_ip }} docker01 docker01.{{ vernify_internal_domain }} jenkins jenkins.docker01 jenkins.docker01.{{ vernify_internal_domain }}
          {{ agent01_ip }} agent01 agent01.{{ vernify_internal_domain }}
        dest: /etc/hosts
        mode: "0644"
        owner: root
        group: root
      become: true
      delegate_to: sec01

    # blueprints.step_ca.issue_certificate runs on localhost (the step CLI
    # is baked into the bootstrap-container image, not the target hosts --
    # see that include_role's apply: block below), so localhost also needs
    # to resolve sec01's internal DNS name. Additive (lineinfile), not a
    # full overwrite, since this is the container's own /etc/hosts.
    - name: "[PRE] Add sec01 DNS entry to localhost's /etc/hosts (issue_certificate runs here)"
      # /etc/hosts inside a Docker container is bind-mounted -- lineinfile/copy
      # use an atomic write-temp-then-rename pattern internally, which fails
      # with "Device or resource busy" against a bind-mount target. Append
      # directly instead, guarded by an idempotency check.
      ansible.builtin.shell: |
        set -o pipefail
        if ! grep -qF "{{ sec01_ip }} sec01" /etc/hosts; then
          echo "{{ sec01_ip }} sec01 sec01.{{ vernify_internal_domain }} vault vault.sec01 vault.sec01.{{ vernify_internal_domain }} step-ca ca.sec01 ca.sec01.{{ vernify_internal_domain }}" >> /etc/hosts
        fi
      args:
        executable: /bin/bash
      changed_when: true

    # blueprints.step_ca.container_server and blueprints.vault.container_server
    # both run community.docker.docker_container against sec01 -- the Docker
    # engine itself is not part of the Packer template and must be installed
    # here before either role runs.
    - name: "[PRE] Check if Docker is already installed on sec01 (idempotency)"
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: sec01_docker_check
      become: true
      delegate_to: sec01

    - name: "[PRE] Install Docker Engine on sec01"
      become: true
      delegate_to: sec01
      when: not sec01_docker_check.stat.exists
      block:
        - name: "Install prerequisites"
          ansible.builtin.apt:
            name: ["ca-certificates", "curl", "python3-pip"]
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: "Create keyrings directory"
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: "Download Docker's official GPG key"
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: "Determine Debian architecture name (dpkg, not ansible_architecture -- avoids translation bugs)"
          ansible.builtin.command: dpkg --print-architecture
          register: dpkg_arch
          changed_when: false

        - name: "Add Docker apt repository"
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ dpkg_arch.stdout }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
            state: present
            filename: docker

        - name: "Install Docker Engine"
          ansible.builtin.apt:
            name: ["docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]
            state: present
            update_cache: true

        - name: "Ensure Docker service is enabled and running"
          ansible.builtin.systemd:
            name: docker
            state: started
            enabled: true

        - name: "Install Docker Python SDK (required by community.docker.docker_container)"
          ansible.builtin.pip:
            name: docker
            state: present
            break_system_packages: true

  tasks:
    # ============================================================
    # STEP 1: Deploy step-ca container
    # ============================================================
    - name: "[STEP 1] Deploy step-ca container on sec01"
      block:
        - name: "Check if step-ca already initialized (idempotency)"
          ansible.builtin.stat:
            path: "/var/lib/step-ca/root_ca.crt"
          register: step_ca_root_cert_check
          delegate_to: sec01
          become: true

        - name: "Run blueprints.step_ca.container_server"
          ansible.builtin.include_role:
            name: blueprints.step_ca.container_server
            apply:
              delegate_to: sec01
              become: true
          vars:
            step_ca_server_image: "smallstep/step-ca:0.27.4"
            step_ca_server_provisioner_password: "{{ step_ca_provisioner_password }}"
            step_ca_server_root_ca_name: "Vernify Root CA"
            step_ca_server_root_ca_cn: "sec01.{{ vernify_internal_domain }}"
            step_ca_server_root_ca_organization: "Vernify"
          register: step_ca_deploy_result

        - name: "Print step-ca deployment result"
          ansible.builtin.debug:
            msg: |
              step-ca deployment: {{ 'skipped (already initialized)' if step_ca_root_cert_check.stat.exists else 'completed' }}
              Fingerprint: {{ step_ca_server_ca_fingerprint | default('see role output') }}

      rescue:
        - name: "step-ca deployment failed"
          ansible.builtin.fail:
            msg: "blueprints.step_ca.container_server failed on sec01. Check role output above."

    # ============================================================
    # STEP 2: Issue TLS certificate for Vault
    # ============================================================
    - name: "[STEP 2] Issue TLS certificate for Vault from step-ca"
      ansible.builtin.include_role:
        name: blueprints.step_ca.issue_certificate
        apply:
          # localhost, not sec01: the step CLI is baked into the
          # bootstrap-container image, not installed on sec01. Cert
          # issuance is a client-side operation against step-ca's
          # network-reachable HTTPS API; the role returns cert/key as
          # facts (content, not file paths), so where the command runs
          # doesn't matter downstream.
          delegate_to: localhost
      vars:
        step_ca_issue_ca_url: "{{ step_ca_endpoint }}"
        step_ca_issue_ca_fingerprint: "{{ step_ca_server_ca_fingerprint | default('') }}"
        step_ca_issue_provisioner_password: "{{ step_ca_provisioner_password }}"
        step_ca_issue_certificate_common_name: "vault.sec01.{{ vernify_internal_domain }}"
        step_ca_issue_certificate_subject_alt_names:
          - "vault"
          - "vault.sec01"
          - "vault.sec01.{{ vernify_internal_domain }}"
          - "{{ sec01_ip }}"
        step_ca_issue_certificate_validity_days: 365
      register: vault_cert_issue_result

    - name: "Set facts for Vault TLS material (PEM content, per vault_server_tls_cert/key contract)"
      ansible.builtin.set_fact:
        vault_tls_cert_pem: "{{ step_ca_issue_certificate_pem }}"
        vault_tls_key_pem: "{{ step_ca_issue_certificate_key_pem }}"
      no_log: true

    # ============================================================
    # STEP 3: Deploy Vault container
    # ============================================================
    - name: "[STEP 3] Deploy Vault container on sec01"
      block:
        - name: "Check if Vault already initialized (idempotency)"
          ansible.builtin.stat:
            path: "/var/lib/vault/core/hsm"
          register: vault_storage_check
          delegate_to: sec01
          become: true

        - name: "Run blueprints.vault.container_server"
          ansible.builtin.include_role:
            name: blueprints.vault.container_server
            apply:
              delegate_to: sec01
              become: true
          vars:
            vault_server_image: "hashicorp/vault:1.17.5"
            vault_server_https_port: 8200
            vault_server_tls_cert: "{{ vault_tls_cert_pem }}"
            vault_server_tls_key: "{{ vault_tls_key_pem }}"
          no_log: true

        - name: "Verify Vault container health (pre-init; expect sealed/uninitialized)"
          ansible.builtin.uri:
            url: "{{ vault_endpoint }}/v1/sys/health"
            method: GET
            validate_certs: false
            status_code: [200, 429, 472, 473, 501, 503]
          delegate_to: sec01
          register: vault_precheck
          retries: 10
          delay: 3
          until: vault_precheck is succeeded

      rescue:
        - name: "Vault container deployment failed"
          ansible.builtin.fail:
            msg: "blueprints.vault.container_server failed on sec01. Check role output above."

    # ============================================================
    # STEP 4: Initialize Vault (includes blocking operator gate)
    # ============================================================
    - name: "[STEP 4] Initialize Vault (operator gate: unseal key backup)"
      ansible.builtin.include_role:
        name: blueprints.vault.init_and_unseal
        apply:
          delegate_to: sec01
          become: true
      vars:
        vault_api_endpoint: "{{ vault_endpoint }}"
        vault_cacert_path: "{{ vault_cacert_path }}"
        vault_backup_verification_enabled: true
      no_log: false  # role itself sets no_log on the sensitive sub-tasks

    # NOTE: vault_root_token / vault_unseal_keys / vault_threshold /
    # vault_is_initialized are now plain facts (not vault_init_output.json.*)
    # because blueprints.vault.init_and_unseal sets them via set_fact directly.

    # ============================================================
    # STEP 5: Unseal Vault (KNOWN GAP: role does not set vault_is_unsealed,
    # so this playbook determines unseal state itself)
    # ============================================================
    - name: "[STEP 5] Unseal Vault"
      block:
        - name: "Run unseal script generated by init_and_unseal role"
          ansible.builtin.command: /opt/vault/unseal.sh
          delegate_to: sec01
          become: true
          register: unseal_script_result
          changed_when: "'Sealed: false' in unseal_script_result.stdout"
          no_log: true

        - name: "Confirm Vault is unsealed (authoritative check; role provides no fact for this)"
          ansible.builtin.uri:
            url: "{{ vault_endpoint }}/v1/sys/health"
            method: GET
            validate_certs: false
          delegate_to: sec01
          register: vault_health
          retries: 10
          delay: 5
          until: vault_health.json.sealed is defined and not vault_health.json.sealed
          failed_when: vault_health.json.sealed | default(true)

        - name: "Vault unsealed successfully"
          ansible.builtin.debug:
            msg: "Vault is unsealed and ready for secret seeding."

      rescue:
        - name: "Unseal failed"
          ansible.builtin.fail:
            msg: |
              Vault unseal did not complete. Check /opt/vault/unseal.sh on sec01
              and confirm the unseal keys file at /opt/vault/unseal-keys.json is intact.

    # ============================================================
    # STEP 6: Seed Vault KV v2 with canonical secret paths
    # (VAULT_SECRET_PATH_MODEL.md — orchestration-layer per LADR-003)
    # ============================================================
    - name: "[STEP 6] Seed Vault KV v2 backend with secrets"
      block:
        - name: "Enable KV v2 backend at kv/"
          environment:
            VAULT_ADDR: "{{ vault_endpoint }}"
            VAULT_CACERT: "{{ vault_cacert_path }}"
            VAULT_TOKEN: "{{ vault_root_token }}"
            VAULT_SKIP_VERIFY: "true"
          ansible.builtin.shell: |
            vault secrets enable -path={{ kv_mount }} kv-v2 2>&1 | grep -v "path is already in use" || true
          delegate_to: sec01
          no_log: true
          changed_when: true

        - name: "Seed kv/platform/step-ca/root-ca-cert"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "{{ kv_mount }}/data/platform/step-ca/root-ca-cert"
            data:
              data:
                value: "{{ step_ca_server_root_ca_cert | default(lookup('file', '/var/lib/step-ca/root_ca.crt')) }}"
                owner: "platform-team"
                usage: "machine"
                managed_by: "automation"
                rotation_period: "never"
          delegate_to: sec01
          no_log: true

        - name: "Seed kv/platform/step-ca/provisioner-password"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "{{ kv_mount }}/data/platform/step-ca/provisioner-password"
            data:
              data:
                value: "{{ step_ca_provisioner_password }}"
                owner: "platform-team"
                usage: "machine"
                managed_by: "automation"
                rotation_period: "90d"
          delegate_to: sec01
          no_log: true

        - name: "Seed kv/platform/vault/tls-cert"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "{{ kv_mount }}/data/platform/vault/tls-cert"
            data:
              data:
                value: "{{ vault_tls_cert_pem }}"
                owner: "platform-team"
                usage: "machine"
                managed_by: "automation"
                rotation_period: "30d"
          delegate_to: sec01
          no_log: true

        - name: "Seed kv/platform/vault/tls-key"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "{{ kv_mount }}/data/platform/vault/tls-key"
            data:
              data:
                value: "{{ vault_tls_key_pem }}"
                owner: "platform-team"
                usage: "machine"
                managed_by: "automation"
                rotation_period: "30d"
          delegate_to: sec01
          no_log: true

        - name: "Seed kv/saas/proxmox/api-token"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "{{ kv_mount }}/data/saas/proxmox/api-token"
            data:
              data:
                value: "{{ proxmox_token }}"
                owner: "infrastructure-team"
                usage: "machine"
                managed_by: "automation"
                rotation_period: "90d"
          delegate_to: sec01
          no_log: true

        - name: "Seed kv/saas/tfc/team-token"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "{{ kv_mount }}/data/saas/tfc/team-token"
            data:
              data:
                value: "{{ terraform_cloud_token }}"
                owner: "infrastructure-team"
                usage: "machine"
                managed_by: "automation"
                rotation_period: "90d"
          delegate_to: sec01
          no_log: true

      rescue:
        - name: "Vault secret seeding failed"
          ansible.builtin.fail:
            msg: "Secret seeding failed. Vault is unsealed but some kv/ paths may be missing. Re-run this playbook (writes are idempotent)."

    # ============================================================
    # STEP 7: Create AppRoles for Jenkins (docker01) and Agents (agent01)
    # ============================================================
    - name: "[STEP 7] Create AppRoles for downstream services"
      block:
        - name: "Enable AppRole auth method"
          environment:
            VAULT_ADDR: "{{ vault_endpoint }}"
            VAULT_CACERT: "{{ vault_cacert_path }}"
            VAULT_TOKEN: "{{ vault_root_token }}"
            VAULT_SKIP_VERIFY: "true"
          ansible.builtin.shell: |
            vault auth enable approle 2>&1 | grep -v "path is already in use" || true
          delegate_to: sec01
          no_log: true
          changed_when: true

        # --- Jenkins AppRole (consumed by Phase 4 / kv/platform/jenkins/approle) ---
        - name: "Create Jenkins AppRole"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "auth/approle/role/jenkins"
            data:
              token_ttl: "1h"
              token_max_ttl: "4h"
              secret_id_ttl: "86400"
              bind_secret_id: true
              token_policies: ["default", "jenkins"]
          delegate_to: sec01
          no_log: true

        - name: "Read Jenkins role_id"
          community.hashi_vault.vault_read:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "auth/approle/role/jenkins/role-id"
          register: jenkins_role_id_result
          delegate_to: sec01
          no_log: true

        - name: "Generate Jenkins secret_id"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "auth/approle/role/jenkins/secret-id"
            data: {}
          register: jenkins_secret_id_result
          delegate_to: sec01
          no_log: true

        - name: "Seed kv/platform/jenkins/approle"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "{{ kv_mount }}/data/platform/jenkins/approle"
            data:
              data:
                role_id: "{{ jenkins_role_id_result.data.data.role_id }}"
                secret_id: "{{ jenkins_secret_id_result.data.data.secret_id }}"
                owner: "jenkins-ci"
                usage: "machine"
                managed_by: "automation"
                rotation_period: "30d"
          delegate_to: sec01
          no_log: true

        # --- Agent01 AppRole (consumed by Phase 5 / kv/platform/agent01/approle) ---
        - name: "Create agent01 AppRole"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "auth/approle/role/agent01"
            data:
              token_ttl: "1h"
              token_max_ttl: "4h"
              secret_id_ttl: "86400"
              bind_secret_id: true
              token_policies: ["default", "agents"]
          delegate_to: sec01
          no_log: true

        - name: "Read agent01 role_id"
          community.hashi_vault.vault_read:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "auth/approle/role/agent01/role-id"
          register: agent01_role_id_result
          delegate_to: sec01
          no_log: true

        - name: "Generate agent01 secret_id"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "auth/approle/role/agent01/secret-id"
            data: {}
          register: agent01_secret_id_result
          delegate_to: sec01
          no_log: true

        - name: "Seed kv/platform/agent01/approle"
          community.hashi_vault.vault_write:
            url: "{{ vault_endpoint }}"
            validate_certs: false
            auth_method: token
            token: "{{ vault_root_token }}"
            path: "{{ kv_mount }}/data/platform/agent01/approle"
            data:
              data:
                role_id: "{{ agent01_role_id_result.data.data.role_id }}"
                secret_id: "{{ agent01_secret_id_result.data.data.secret_id }}"
                owner: "build-agents"
                usage: "machine"
                managed_by: "automation"
                rotation_period: "30d"
          delegate_to: sec01
          no_log: true

      rescue:
        - name: "AppRole creation failed"
          ansible.builtin.fail:
            msg: "AppRole setup failed. Vault secrets from Step 6 are intact; re-run this playbook to retry AppRole creation (idempotent)."

    # ============================================================
    # STEP 8: Cleanup ephemeral root token (per design: deleted after seeding)
    # ============================================================
    - name: "[STEP 8] Remove root token file from sec01"
      ansible.builtin.file:
        path: "/opt/vault/root-token.txt"
        state: absent
      delegate_to: sec01
      become: true

    # ============================================================
    # STEP 9: Final verification
    # ============================================================
    - name: "[STEP 9] Final verification"
      block:
        - name: "Verify Vault is unsealed"
          ansible.builtin.uri:
            url: "{{ vault_endpoint }}/v1/sys/health"
            method: GET
            validate_certs: false
          register: final_vault_health
          failed_when: final_vault_health.json.sealed | default(true)

        - name: "Print Phase 3 completion summary"
          ansible.builtin.debug:
            msg: |
              ========== PHASE 3 COMPLETE ==========
              Security Core (sec01) is online:
                - step-ca root CA initialized + provisioner ready
                - Vault initialized, unsealed, KV v2 enabled at {{ kv_mount }}/
                - Secrets seeded: kv/platform/step-ca/*, kv/platform/vault/*,
                  kv/saas/proxmox/api-token, kv/saas/tfc/team-token
                - AppRoles created: jenkins (kv/platform/jenkins/approle),
                  agent01 (kv/platform/agent01/approle)
                - Root token file removed from sec01

              Operator reminder: unseal keys at /opt/vault/unseal-keys.json on
              sec01 must already be backed up externally (gate enforced by
              blueprints.vault.init_and_unseal in Step 4). Vault itself never
              stores its own unseal keys.

              Next: Phase 4 (docker01 / Jenkins)
              =====================================
      rescue:
        - name: "Final verification failed"
          ansible.builtin.fail:
            msg: "Phase 3 post-checks failed. Vault may be unsealed but verification could not confirm it — check manually before proceeding to Phase 4."

  handlers:
    - name: "Reload systemd daemon"
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      listen: "Reload systemd daemon"
