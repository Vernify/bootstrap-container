---
# Phase 5 Orchestration Playbook — Build Capacity (agent01 LXC)
#
# Provisioning (Terraform apply against terraform-agent01-deploy, a direct
# proxmox_lxc resource — no module, no VM) happens in
# scripts/bootstrap-phase-3-5.sh; this playbook starts from an already-
# reachable agent01 LXC container, deploys the Jenkins inbound agent and
# Vault Agent, and installs the build toolchain (Packer, Terraform, Ansible).
#
# Real role FQCNs and variable names (verified against
# meta/argument_specs.yml / defaults/main.yml / tasks/main.yml on
# feat/phase-3-5-bootstrap):
#   blueprints.jenkins.agent              -> jenkins_agent_* (NOTE: this role
#                                             has no jenkins_controller_token
#                                             or jenkins_agent_labels inputs —
#                                             those were draft inventions.
#                                             The real role only takes
#                                             jenkins_agent_server_url,
#                                             jenkins_agent_name,
#                                             jenkins_agent_secret (the JNLP
#                                             join secret, which THIS
#                                             playbook must obtain from the
#                                             Jenkins controller — see Step 2
#                                             — there is no admin-token-based
#                                             registration path in this role).
#                                             It also sets no facts/outputs.)
#   blueprints.vault_integrations.vault_agent -> vault_integration_vault_*
#                                             (RESOLVED: argument_specs.yml for
#                                             this role previously was a copy
#                                             of the sibling ldap_auth role's
#                                             spec and documented
#                                             vault_integration_ldap_*
#                                             variables that the real
#                                             tasks/main.yml never read. That
#                                             spec/code mismatch was fixed
#                                             (commit aa33fd1 and related) —
#                                             argument_specs.yml now correctly
#                                             documents
#                                             vault_integration_vault_endpoint/
#                                             _role_id/_secret_id, matching
#                                             this playbook's variable names.)
#
# RESOLVED (previously tracked as a KNOWN GAP): blueprints.vault_integrations.vault_agent
# did not exist at all on the collection's `main` branch when this playbook
# was first written; it existed only on the unmerged feat/phase-b-collections
# branch. The role now exists, with a correct argument_specs.yml, merged into
# the feat/phase-3-5-bootstrap branch of ansible-collection-vault-integrations
# — the branch this playbook itself ships on. No outstanding dependency on an
# unmerged branch remains. See docs/delivery/COLLECTION_ROLE_INVENTORY.md for
# the historical record of this gap.

- name: "Phase 5 — Build Capacity (agent01) Orchestration"
  hosts: localhost
  gather_facts: true
  vars:
    sec01_ip: "{{ sec01_ip | mandatory }}"
    docker01_ip: "{{ docker01_ip | mandatory }}"
    agent01_ip: "{{ agent01_ip | mandatory }}"
    ansible_ssh_private_key_file_arg: "{{ ansible_ssh_private_key_file | default('/root/.ssh/id_vernify_bootstrap') }}"
    bootstrap_ssh_user: "{{ ansible_user | default('ubuntu') }}"

    vernify_internal_domain: "vernify.internal"

    vault_endpoint: "https://sec01.{{ vernify_internal_domain }}:8200"
    vault_cacert_path: "/etc/ssl/certs/step-ca-root.crt"
    jenkins_endpoint: "https://docker01.{{ vernify_internal_domain }}:8443"
    kv_mount: "kv"
    jenkins_admin_user: "admin"

  pre_tasks:
    - name: "[PRE] Validate required inputs"
      ansible.builtin.assert:
        that:
          - sec01_ip is defined and sec01_ip | length > 0
          - docker01_ip is defined and docker01_ip | length > 0
          - agent01_ip is defined and agent01_ip | length > 0
        fail_msg: "Missing sec01_ip / docker01_ip / agent01_ip. Expected as extra-vars from scripts/bootstrap-phase-3-5.sh."

    # MUST come before the Jenkins reachability check below, and before the
    # later localhost-run Vault lookups: those run from localhost (the
    # bootstrap container) against docker01.vernify.internal /
    # sec01.vernify.internal, and each `docker compose run` is a fresh
    # container whose /etc/hosts does NOT carry over earlier phases' entries
    # -- without this first, the check fails with "Name or service not
    # known". The agent01 /etc/hosts task below is delegate_to: agent01, a
    # different host's file, and does not help localhost resolve anything.
    - name: "[PRE] Add sec01/docker01 DNS entries to localhost's /etc/hosts (checks + lookups run here)"
      # /etc/hosts inside a Docker container is bind-mounted -- lineinfile/copy
      # use an atomic write-temp-then-rename pattern internally, which fails
      # with "Device or resource busy" against a bind-mount target. Append
      # directly instead, guarded by an idempotency check.
      ansible.builtin.shell: |
        set -o pipefail
        if ! grep -qF "{{ sec01_ip }} sec01" /etc/hosts; then
          echo "{{ sec01_ip }} sec01 sec01.{{ vernify_internal_domain }} vault vault.sec01 vault.sec01.{{ vernify_internal_domain }} step-ca ca.sec01 ca.sec01.{{ vernify_internal_domain }}" >> /etc/hosts
        fi
        if ! grep -qF "{{ docker01_ip }} docker01" /etc/hosts; then
          echo "{{ docker01_ip }} docker01 docker01.{{ vernify_internal_domain }} jenkins jenkins.docker01 jenkins.docker01.{{ vernify_internal_domain }}" >> /etc/hosts
        fi
      args:
        executable: /bin/bash
      changed_when: true

    - name: "[PRE] Verify Phase 4 completed (Jenkins reachable)"
      ansible.builtin.uri:
        url: "{{ jenkins_endpoint }}/api/json"
        method: GET
        validate_certs: false
        status_code: [200, 401, 403]
      register: jenkins_check
      retries: 5
      delay: 5

    - name: "[PRE] Add agent01 to in-memory inventory"
      ansible.builtin.add_host:
        name: agent01
        ansible_host: "{{ agent01_ip }}"
        # agent01 is an unprivileged LXC container with ssh_public_keys
        # authorized for root (terraform-agent01-deploy main.tf comment:
        # "LXC containers run as root") — NOT the ubuntu cloud-init user
        # used by the sec01/docker01 VMs.
        ansible_user: root
        ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file_arg }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    # This phase delegates tasks to sec01 (Vault AppRole/admin-token reads)
    # and docker01 (Jenkins node create + JNLP secret fetch). Each phase is
    # its own ansible-playbook invocation with a fresh in-memory inventory,
    # so sec01/docker01 -- added by earlier phases -- are not present here.
    # Without these, the first delegate_to: sec01 / delegate_to: docker01
    # task fails UNREACHABLE against a literal unknown host. Both are
    # Ubuntu VMs using the cloud-init ubuntu user, unlike agent01 above.
    - name: "[PRE] Add sec01 to in-memory inventory"
      ansible.builtin.add_host:
        name: sec01
        ansible_host: "{{ sec01_ip }}"
        ansible_user: "{{ bootstrap_ssh_user }}"
        ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file_arg }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    - name: "[PRE] Add docker01 to in-memory inventory"
      ansible.builtin.add_host:
        name: docker01
        ansible_host: "{{ docker01_ip }}"
        ansible_user: "{{ bootstrap_ssh_user }}"
        ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file_arg }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    - name: "[PRE] Configure /etc/hosts on agent01"
      ansible.builtin.copy:
        content: |
          127.0.0.1 localhost
          ::1 ip6-localhost ip6-loopback

          {{ sec01_ip }} sec01 sec01.{{ vernify_internal_domain }} vault vault.sec01 vault.sec01.{{ vernify_internal_domain }} step-ca ca.sec01 ca.sec01.{{ vernify_internal_domain }}
          {{ docker01_ip }} docker01 docker01.{{ vernify_internal_domain }} jenkins jenkins.docker01 jenkins.docker01.{{ vernify_internal_domain }}
          {{ agent01_ip }} agent01 agent01.{{ vernify_internal_domain }}
        dest: /etc/hosts
        mode: "0644"
        owner: root
        group: root
      become: true
      delegate_to: agent01

    # Phase 3 retains the Vault root token at /opt/vault/root-token.txt on
    # sec01 (root 0600) for later phases; read it once here and use it for
    # every Vault CLI/API call below, replacing the empty
    # lookup('env', 'VAULT_TOKEN').
    - name: "[PRE] Read Vault root token from sec01"
      ansible.builtin.slurp:
        src: /opt/vault/root-token.txt
      register: _vault_root_token_slurp
      delegate_to: sec01
      become: true
      no_log: true

    - name: "[PRE] Set vault_root_token fact"
      ansible.builtin.set_fact:
        vault_root_token: "{{ _vault_root_token_slurp.content | b64decode | trim }}"
      no_log: true

  tasks:
    # ============================================================
    # STEP 1: Retrieve agent01 AppRole credentials from Vault
    # (written during Phase 3 secret seeding; never hardcoded here)
    # ============================================================
    - name: "[STEP 1] Retrieve agent01 AppRole credentials from Vault"
      environment:
        VAULT_ADDR: "{{ vault_endpoint }}"
        VAULT_CACERT: "{{ vault_cacert_path }}"
        VAULT_TOKEN: "{{ vault_root_token }}"
        VAULT_SKIP_VERIFY: "true"
      ansible.builtin.command: >
        vault kv get -format=json {{ kv_mount }}/platform/agent01/approle
      register: agent01_approle_lookup
      delegate_to: sec01
      no_log: true
      changed_when: false

    - name: "Parse agent01 AppRole credentials"
      ansible.builtin.set_fact:
        agent01_vault_role_id: "{{ (agent01_approle_lookup.stdout | from_json).data.data.role_id }}"
        agent01_vault_secret_id: "{{ (agent01_approle_lookup.stdout | from_json).data.data.secret_id }}"
      no_log: true

    # ============================================================
    # STEP 2: Retrieve Jenkins admin token and a fresh JNLP agent secret
    # ============================================================
    - name: "[STEP 2] Retrieve Jenkins admin token from Vault"
      environment:
        VAULT_ADDR: "{{ vault_endpoint }}"
        VAULT_CACERT: "{{ vault_cacert_path }}"
        VAULT_TOKEN: "{{ vault_root_token }}"
        VAULT_SKIP_VERIFY: "true"
      ansible.builtin.command: >
        vault kv get -field=value {{ kv_mount }}/platform/jenkins/admin-token
      register: jenkins_admin_token_lookup
      delegate_to: sec01
      no_log: true
      changed_when: false

    - name: "Set Jenkins admin token fact"
      ansible.builtin.set_fact:
        jenkins_admin_token: "{{ jenkins_admin_token_lookup.stdout }}"
      no_log: true

    - name: "Create agent01 node on Jenkins controller (if not already present)"
      ansible.builtin.uri:
        url: "{{ jenkins_endpoint }}/computer/doCreateItem?name=agent01&type=hudson.slaves.DumbSlave"
        method: POST
        user: "{{ jenkins_admin_user }}"
        password: "{{ jenkins_admin_token }}"
        force_basic_auth: true
        validate_certs: false
        body_format: form-urlencoded
        body:
          name: agent01
          type: hudson.slaves.DumbSlave
          json: >-
            {"name": "agent01", "nodeDescription": "Vernify build agent (LXC)",
             "numExecutors": "2", "remoteFS": "/var/lib/jenkins-agent",
             "labelString": "agent01 packer-build terraform-plan ansible-execute",
             "mode": "NORMAL", "type": "hudson.slaves.DumbSlave",
             "retentionStrategy": {"stapler-class": "hudson.slaves.RetentionStrategy$Always"},
             "launcher": {"stapler-class": "hudson.slaves.JNLPLauncher", "workDirSettings": {"disabled": false}},
             "nodeProperties": {"stapler-class-bag": "true"}}
      delegate_to: docker01
      register: jenkins_node_create
      failed_when:
        - jenkins_node_create.status not in [200, 302, 400]
        # 400 is returned by some Jenkins versions when the node already exists; treated as idempotent no-op.
      changed_when: jenkins_node_create.status in [200, 302]

    - name: "Retrieve JNLP agent secret for agent01"
      ansible.builtin.uri:
        url: "{{ jenkins_endpoint }}/computer/agent01/jenkins-agent.jnlp"
        method: GET
        user: "{{ jenkins_admin_user }}"
        password: "{{ jenkins_admin_token }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      delegate_to: docker01
      register: jnlp_file_content
      no_log: true

    - name: "Extract JNLP secret from agent.jnlp XML"
      ansible.builtin.set_fact:
        jenkins_agent_jnlp_secret: "{{ jnlp_file_content.content | regex_search('<argument>([0-9a-f]+)</argument>', '\\1') | first }}"
      no_log: true

    # ============================================================
    # STEP 3: Deploy Jenkins agent (systemd)
    # ============================================================
    - name: "[STEP 3] Deploy Jenkins agent on agent01"
      ansible.builtin.include_role:
        name: blueprints.jenkins.agent
        apply:
          delegate_to: agent01
          become: true
      vars:
        jenkins_agent_server_url: "{{ jenkins_endpoint }}"
        jenkins_agent_name: "agent01"
        jenkins_agent_secret: "{{ jenkins_agent_jnlp_secret }}"
        jenkins_controller_mode: "container"
        jenkins_agent_use_websocket: true
        jenkins_agent_validate_certs: false  # step-ca root not yet trusted system-wide on agent01
      no_log: true

    # ============================================================
    # STEP 4: Deploy Vault Agent (systemd, AppRole auth, auto-renewal)
    # ============================================================
    - name: "[STEP 4] Deploy Vault Agent on agent01"
      ansible.builtin.include_role:
        name: blueprints.vault_integrations.vault_agent
        apply:
          delegate_to: agent01
          become: true
      vars:
        vault_integration_vault_endpoint: "{{ vault_endpoint }}"
        vault_integration_vault_role_id: "{{ agent01_vault_role_id }}"
        vault_integration_vault_secret_id: "{{ agent01_vault_secret_id }}"
      no_log: true

    # ============================================================
    # STEP 5: Install build toolchain (Packer, Terraform, Ansible)
    # ============================================================
    - name: "[STEP 5] Install build toolchain on agent01"
      block:
        - name: "Check if HashiCorp apt repo already configured (idempotency)"
          ansible.builtin.stat:
            path: /etc/apt/sources.list.d/hashicorp.list
          register: hashicorp_repo_check
          delegate_to: agent01

        - name: "Install HashiCorp apt repository"
          block:
            - name: "Install gnupg/curl prerequisites"
              ansible.builtin.apt:
                name: ["gnupg", "curl"]
                state: present
                update_cache: true
                cache_valid_time: 3600

            - name: "Add HashiCorp GPG key"
              ansible.builtin.shell: |
                curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg

            - name: "Add HashiCorp apt repository"
              ansible.builtin.shell: |
                echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
                  | tee /etc/apt/sources.list.d/hashicorp.list

            - name: "Update apt cache after adding HashiCorp repo"
              ansible.builtin.apt:
                update_cache: true
          when: not hashicorp_repo_check.stat.exists
          become: true
          delegate_to: agent01

        - name: "Install Packer"
          ansible.builtin.apt:
            name: packer
            state: present
          become: true
          delegate_to: agent01

        - name: "Install Terraform"
          ansible.builtin.apt:
            name: terraform
            state: present
          become: true
          delegate_to: agent01

        - name: "Install Ansible (ansible-core, pinned to match bootstrap container's version family)"
          ansible.builtin.apt:
            name: ansible-core
            state: present
          become: true
          delegate_to: agent01

        - name: "Check if step CLI already installed (idempotency)"
          ansible.builtin.stat:
            path: /usr/local/bin/step
          register: step_cli_check
          delegate_to: agent01

        - name: "Install step CLI for certificate verification"
          block:
            - name: "Download step CLI release"
              ansible.builtin.get_url:
                url: "https://github.com/smallstep/cli/releases/download/v0.27.4/step_linux_0.27.4_amd64.tar.gz"
                dest: /tmp/step.tar.gz
                mode: "0644"

            - name: "Extract and install step CLI"
              ansible.builtin.unarchive:
                src: /tmp/step.tar.gz
                dest: /tmp
                remote_src: true

            - name: "Move step binary into place"
              ansible.builtin.shell: |
                find /tmp -name step -type f -path '*step_*' -exec mv {} /usr/local/bin/step \;
                chmod +x /usr/local/bin/step
          when: not step_cli_check.stat.exists
          become: true
          delegate_to: agent01

        - name: "Verify toolchain versions"
          ansible.builtin.shell: |
            packer version && terraform version && ansible --version | head -1 && step version
          delegate_to: agent01
          register: toolchain_versions
          changed_when: false

        - name: "Print installed toolchain versions"
          ansible.builtin.debug:
            msg: "{{ toolchain_versions.stdout_lines }}"

      rescue:
        - name: "Toolchain installation failed"
          ansible.builtin.fail:
            msg: "Toolchain installation failed on agent01. Check apt/network output above."

    # ============================================================
    # STEP 6: Verify agent connection to Jenkins
    # ============================================================
    - name: "[STEP 6] Verify agent01 is online in Jenkins"
      ansible.builtin.uri:
        url: "{{ jenkins_endpoint }}/computer/agent01/api/json"
        method: GET
        user: "{{ jenkins_admin_user }}"
        password: "{{ jenkins_admin_token }}"
        force_basic_auth: true
        validate_certs: false
      delegate_to: docker01
      register: agent_status
      retries: 24
      delay: 5
      until: agent_status.json.offline is defined and not agent_status.json.offline
      no_log: true

    # ============================================================
    # STEP 7: Completion summary
    # ============================================================
    - name: "Phase 5 complete"
      ansible.builtin.debug:
        msg: |
          ========== PHASE 5 COMPLETE — VERNIFY HOMELAB READY ==========
          Build Capacity (agent01) is online:
            - Jenkins agent connected to docker01 (systemd, WebSocket JNLP)
            - Vault Agent running (AppRole auth, auto-renewal)
            - Toolchain installed: Packer, Terraform, ansible-core, step CLI

          All three infrastructure cores are now self-hosted:
            - sec01    ({{ sec01_ip }}):    step-ca + Vault
            - docker01 ({{ docker01_ip }}): Jenkins controller
            - agent01  ({{ agent01_ip }}):  Jenkins agent + Vault agent + toolchain

          Bootstrap container can now be archived and retired (see RUNBOOK.md).
          ================================================================
