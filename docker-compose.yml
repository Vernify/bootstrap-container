# ===========================================================================
# Vernify Bootstrap Container — Docker Compose convenience wrapper
#
# Usage:
#   cp .env.example .env
#   $EDITOR .env        # fill in required values (paths, secrets)
#   docker compose run -it --rm bootstrap
#
# Docker Compose automatically loads .env from the current directory,
# so all secrets and paths are available when the container starts.
# ===========================================================================
services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    image: vernify/bootstrap-container:local
    stdin_open: true
    tty: true
    # Pass through all bootstrap secrets from the host environment.
    # Values are read from the shell that ran `source .env`.
    environment:
      - PROXMOX_URL
      - PROXMOX_USER
      - PROXMOX_PASSWORD
      - PROXMOX_NODE
      - PROXMOX_STORAGE
      - PROXMOX_ISO_STORAGE
      - TFC_TOKEN
      - GIT_PAT
      - STEP_CA_PROVISIONER_PASSWORD
      - BOOTSTRAP_SSH_PRIVATE_KEY_B64
      - VAULT_ADDR
      - VAULT_TOKEN
      - PKR_VAR_vm_name
      - PKR_VAR_iso_filename
    volumes:
      # Mount the operator SSH private key for Ansible VM access.
      # Adjust the host path to match your actual key location.
      - type: bind
        source: ${BOOTSTRAP_SSH_KEY_HOST_PATH:-~/.ssh/id_vernify_bootstrap}
        target: /run/secrets/bootstrap_ssh_key
        read_only: true
      # Mount the entire workspace (~/workspace) so all IaC code is available inside.
      # This includes vernify, iac-foundry, and all subprojects.
      # BOOTSTRAP_WORKSPACE_PATH is loaded from .env by docker-compose automatically.
      - type: bind
        source: ${BOOTSTRAP_WORKSPACE_PATH}
        target: /workspace
