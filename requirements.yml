---
# ---------------------------------------------------------------------------
# Vernify Bootstrap Container — Ansible Galaxy requirements
#
# Blueprints collections: Git source pinned to a commit SHA (interim fix)
#   All blueprints.* collections are pinned to a specific Git commit SHA,
#   not a branch name. This is a deliberate interim measure (DEF-2).
#   IMPORTANT: pinning to a SHA changes the *symptom* but does not by itself
#   stop ansible-galaxy from crashing on re-install. ansible-galaxy's
#   meets_requirements() unconditionally feeds the requirement string through
#   LooseVersion()/SemanticVersion.from_loose_version() whenever a collection
#   with a matching fqcn is already installed -- and a 40-char git SHA is just
#   as unparseable to that code as the branch name `main` was, raising the same
#   `ValueError: Non integer values in LooseVersion (...)`. Confirmed by testing
#   both `version: main` and a SHA pin against an already-installed collection.
#   The actual bypass is `--force` (or `--force-with-deps`): ansible-galaxy's
#   own source skips the meets_requirements() comparison entirely when --force
#   is passed (see ansible/galaxy/collection/__init__.py, install_collections).
#   ALWAYS install/re-install with --force:
#     ansible-galaxy collection install -r requirements.yml --force
#   To consume a newer collection version: get the new HEAD SHA from the
#   collection's repo (`git rev-parse origin/main`) and update the `version:`
#   value below, then rebuild the image.
#
# Community collections: Galaxy source with semantic versioning
#   External collections are pinned to semantic versions for stability.
#   Update versions incrementally after validating backward compatibility.
#   As of June 2026:
#     - community.docker: >=3.10.0,<4.0.0 (container lifecycle management)
#     - community.general: >=3.0.0,<4.0.0 (general utilities)
#     - community.hashi_vault: >=7.0.0,<8.0.0 (Vault API integration; 1.x has no vault_write)
#
# To update a community collection version:
#   1. Edit the version constraint (e.g., ">=X.Y.Z,<(X+1).0.0")
#   2. Run: ansible-galaxy collection install -r requirements.yml --force
#   3. Validate playbook syntax: ansible-playbook --syntax-check playbooks/*.yml
#   4. Test in dev environment before deploying to production
# ---------------------------------------------------------------------------
collections:
  # --- Blueprints Collections (Source: Git) ---
  - name: blueprints.common
    source: https://github.com/iac-foundry/ansible-collection-common
    type: git
    version: c79113c18f5dbfcc99d7f7f927db7015c39c5055  # origin/main as of this fix

  # The step-ca collection now exists on GitHub. Its default (and only)
  # branch is feat/phase-3-5-bootstrap -- this engagement's branch-only
  # working model never pushes to main, so pin to the actual HEAD commit
  # on that branch, same as the other git-source collections below.
  - name: blueprints.step_ca
    source: https://github.com/iac-foundry/ansible-collection-step-ca
    type: git
    version: 2e53e26ba2beef0f8f25cd354a1bd0d33589301c  # origin/feat/phase-3-5-bootstrap as of this fix

  - name: blueprints.vault
    source: https://github.com/iac-foundry/ansible-collection-vault
    type: git
    version: 31b80d1b3f528918a2f2bf208a0be65663b2048c  # origin/feat/phase-3-5-bootstrap as of this fix

  - name: blueprints.vault_integrations
    source: https://github.com/iac-foundry/ansible-collection-vault-integrations
    type: git
    version: 5735cbd091ba1c89a0be4b344766dbb9922b50e4  # origin/feat/phase-3-5-bootstrap as of this fix

  - name: blueprints.jenkins
    source: https://github.com/iac-foundry/ansible-collection-jenkins
    type: git
    version: 94b751a8acea2cc5771f30e6185d795810ce05bb  # origin/feat/phase-3-5-bootstrap as of this fix

  - name: blueprints.jenkins_integrations
    source: https://github.com/iac-foundry/ansible-collection-jenkins-integrations
    type: git
    version: c0ad39c89a6c93321466db0481b97ef3ee7f9bab  # origin/feat/phase-3-5-bootstrap as of this fix

  - name: blueprints.graylog
    source: https://github.com/iac-foundry/ansible-collection-graylog
    type: git
    version: 0936762c227afbe29693d465d8aa5d8e01e3336a  # origin/main as of this fix (local and origin agree)

  # --- Community Collections (Source: Ansible Galaxy) ---
  # Docker container lifecycle management (required for container_server roles
  # in blueprints.step_ca, blueprints.vault, and blueprints.jenkins, which use
  # community.docker.docker_container at runtime)
  - name: community.docker
    version: ">=3.10.0,<4.0.0"

  # General utilities and file/template operations
  - name: community.general
    version: ">=3.0.0,<4.0.0"

  # Vault API client and lookup plugins (required for vault_auth/vault_integrations roles).
  # 1.x only ships vault_read -- no vault_write/vault_kv2_write at all -- which
  # phase-3-orchestrate.yml's secret-seeding step needs. Bumped to the latest
  # available major (7.x) after the v1 upper bound was found blocking a live
  # Phase 3 run.
  - name: community.hashi_vault
    version: ">=7.0.0,<8.0.0"
